<script>
  (function() {
    const checkboxes = document.querySelectorAll('input[name="service"]');
    const headerCounter = document.getElementById('selection-counter-header');
    const countDisplay = document.getElementById('summary-service-count');
    const durationDisplay = document.getElementById('summary-duration');
    const totalDisplay = document.getElementById('summary-total-price');
    const continueBtn = document.getElementById('btn-continue');

    function updateSummary() {
      let count = 0;
      let total = 0;
      let totalMins = 0;

      checkboxes.forEach(cb => {
        const row = cb.closest('label');
        if (cb.checked) {
          count++;
          total += parseInt(cb.value, 10);
          totalMins += parseInt(cb.dataset.duration, 10);
          row.classList.add('bg-surface-container/40');
        } else {
          row.classList.remove('bg-surface-container/40');
        }
      });

      const formattedTotal = '₦' + total.toLocaleString('en-US');
      countDisplay.textContent = `Selected (${count} service${count === 1 ? '' : 's'})`;
      durationDisplay.textContent = `${totalMins} mins`;
      totalDisplay.textContent = formattedTotal;
      headerCounter.textContent = `${count} selected`;

      if (count > 0) {
        continueBtn.disabled = false;
        continueBtn.className = "w-full h-[52px] rounded-xl font-title-sm text-title-sm uppercase tracking-wider flex items-center justify-center gap-2 transition-all bg-primary-container text-on-primary-container shadow-md active:scale-[0.99] cursor-pointer hover:bg-primary";
      } else {
        continueBtn.disabled = true;
        continueBtn.className = "w-full h-[52px] rounded-xl font-title-sm text-title-sm uppercase tracking-wider flex items-center justify-center gap-2 transition-all bg-surface-container-high text-outline cursor-not-allowed";
      }
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateSummary);
    });

    continueBtn.addEventListener('click', function() {
      if (this.disabled) return;
      const selected = Array.from(checkboxes)
        .filter(c => c.checked)
        .map(c => ({ name: c.dataset.name, price: c.value, duration: c.dataset.duration }));
      try {
        sessionStorage.setItem('crafted_selected_services', JSON.stringify(selected));
      } catch (e) {}
      const targetNav = document.querySelector('a[data-path="choose-time"]');
      if (targetNav) {
        targetNav.click();
      }
    });

    // Preselect the first service for immediate delight
    if (checkboxes.length > 0) {
      checkboxes[0].checked = true;
      updateSummary();
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.45)]" data-active-classes="text-primary font-semibold"><div class="flex justify-around items-center h-16 px-space-xs"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] transition-colors text-primary font-semibold" data-path="services" href="#"><span class="material-symbols-outlined text-[20px]">content_cut</span><span class="font-label-sm text-label-sm uppercase mt-1">Book</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-colors" data-path="choose-time" href="#"><span class="material-symbols-outlined text-[20px]">schedule</span><span class="font-label-sm text-label-sm uppercase mt-1">Time</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-colors" data-path="booking-summary" href="#"><span class="material-symbols-outlined text-[20px]">receipt_long</span><span class="font-label-sm text-label-sm uppercase mt-1">Summary</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-colors" data-path="my-bookings" href="#"><span class="material-symbols-outlined text-[20px]">calendar_today</span><span class="font-label-sm text-label-sm uppercase mt-1">Bookings</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-colors" data-path="admin-portal" href="#"><span class="material-symbols-outlined text-[20px]">shield_person</span><span class="font-label-sm text-label-sm uppercase mt-1">Admin</span></a></div></nav>
